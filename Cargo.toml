[package]
name = "rust-latex-parser"
version = "0.2.0"
edition = "2021"
description = "A LaTeX equation parser that produces an abstract syntax tree. Supports fractions, roots, matrices, aligned equations, arrays, big operators, Greek letters, accents, colors, and 270+ Unicode symbols — with convenient bareword syntax and lossless error recovery."
license = "MIT"
repository = "https://github.com/William-Selna/Rust-LaTeX-Parser"
keywords = ["latex", "math", "equation", "parser", "ast"]
categories = ["parser-implementations", "mathematics"]

