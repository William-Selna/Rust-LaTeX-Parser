[package]
name = "rust-latex-parser"
version = "0.2.0"
edition = "2021"
description = "Math input for equation editors: parses LaTeX or plain notation (sqrt(x)/2 <= abs(y)) into an AST and writes LaTeX, MathML or Unicode. Never fails on half-typed input. No dependencies."
license = "MIT"
repository = "https://github.com/William-Selna/Rust-LaTeX-Parser"
keywords = ["latex", "math", "equation", "mathml", "parser"]
categories = ["parser-implementations", "mathematics"]

[dependencies]
