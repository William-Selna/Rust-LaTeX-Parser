[package]
name = "rust-latex-parser"
version = "0.2.0"
edition = "2021"
description = "Math input for equation editors: parses LaTeX or plain notation (sqrt(x)/2 <= abs(y)) into an AST with source spans and writes LaTeX, MathML, SVG or Unicode. Never fails or crashes on half-typed input. No dependencies."
license = "MIT"
repository = "https://github.com/William-Selna/Rust-LaTeX-Parser"
keywords = ["latex", "math", "equation", "mathml", "parser"]
categories = ["parser-implementations", "mathematics"]

[features]
# Every output format is on by default. For just the parser and tree, use
# `default-features = false` and enable only the formats you need.
default = ["latex", "mathml", "unicode", "svg"]
# `to_latex`: canonical LaTeX.
latex = []
# `to_mathml`: MathML Core for native browser rendering.
mathml = []
# `to_unicode`: plain text like `x² + √y`.
unicode = []
# `to_svg`: standalone SVG images (uses `unicode` for the accessible title).
svg = ["unicode"]

[dependencies]

[package.metadata.docs.rs]
all-features = true
